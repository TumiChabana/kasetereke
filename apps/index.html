<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaSetereke Administrator Console</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; font-family: var(--font-body); color: var(--text); background: var(--background); }
    aside { background: var(--tan-tint); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-family: var(--font-heading); font-size: 1.3rem; margin: 0; color: var(--ink); }
    h2 { font-family: var(--font-heading); margin-top: 0; color: var(--ink); }
    label { font-size: 0.85rem; color: var(--muted); display: block; margin-bottom: 4px; }
    select { font: inherit; padding: 6px 8px; border: 1px solid var(--border); background: #fff; }
    nav { display: flex; flex-direction: column; gap: 4px; }
    nav a { padding: 10px 12px; color: var(--ink); text-decoration: none; }
    nav a.active { background: var(--ink); color: #fff; }
    .note { color: var(--muted); font-size: 0.85rem; }
    main { padding: 32px; }
    section { background: #fff; border: 1px solid var(--border); padding: 24px; overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { background: var(--tan-tint); }
    button.action { background: var(--gold); color: var(--ink); border: none; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; margin-left: 8px; }
    .status { background: var(--gold-tint); padding: 10px 12px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <aside>
    <h1>KaSetereke Administrator Console</h1>
    <div>
      <label for="roleSelect">Demonstration role</label>
      <select id="roleSelect"></select>
    </div>
    <nav id="nav"></nav>
    <p class="note">Sample data only. The role selector is for demonstration and will be replaced by the real sign-in.</p>
  </aside>
  <main><section id="view"></section></main>

  <script>
    // 1. The roles, using the same names as the role column in the database.
    const ROLE_LABELS = {
      traveller: "Traveller",
      operator: "Operator",
      admin: "Admin",
      security_officer: "Security Officer"
    };

    // 2. Role gate: which roles may open each screen, and whether they may only read or also write.
    const screens = {
      users:          { title: "Users and roles",     access: { admin: "write", security_officer: "read" }, render: renderUsers },
      classification: { title: "Data classification", access: { admin: "read", security_officer: "read" }, render: renderPlaceholder },
      security:       { title: "Security settings",   access: { security_officer: "write", admin: "read" }, render: renderPlaceholder },
      operator:       { title: "Operator dashboard",  access: { operator: "write" }, render: renderPlaceholder },
      audit:          { title: "Audit log",           access: { admin: "read", security_officer: "read" }, render: renderPlaceholder }
    };

    // 3. Sample data. No real people. The person who is signed in for each demonstration role.
    const DEMO_PERSON = {
      admin: "admin@example.com",
      security_officer: "security@example.com",
      operator: "operator@example.com"
    };
    const users = [
      { name: "Sample Admin", email: "admin@example.com", role: "admin" },
      { name: "Sample Security Officer", email: "security@example.com", role: "security_officer" },
      { name: "Sample Operator", email: "operator@example.com", role: "operator" },
      { name: "Sample Traveller", email: "traveller@example.com", role: "traveller" }
    ];

    let role = "admin";
    let statusMessage = "";

    // 4. Helpers. textContent is used everywhere, so data can never run as code.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }
    function makeTable(columns, rows) {
      const table = el("table");
      const head = el("tr");
      columns.forEach(c => head.appendChild(el("th", c)));
      table.appendChild(head);
      rows.forEach(cells => {
        const tr = el("tr");
        cells.forEach(cell => {
          const td = el("td");
          if (cell instanceof Node) td.appendChild(cell); else td.textContent = cell;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      return table;
    }

    // 5. Screens.
    function renderUsers(view, level) {
      view.appendChild(el("h2", "Users and roles"));
      if (statusMessage) { view.appendChild(el("div", statusMessage, "status")); statusMessage = ""; }
      const rows = users.map(u => {
        const isMe = u.email === DEMO_PERSON[role];
        let roleCell;
        if (level === "write" && !isMe) {
          // Only an Admin can change the role of another person.
          const select = el("select");
          Object.keys(ROLE_LABELS).forEach(key => {
            const option = el("option", ROLE_LABELS[key]);
            option.value = key;
            if (key === u.role) option.selected = true;
            select.appendChild(option);
          });
          const save = el("button", "Save role", "action");
          save.addEventListener("click", () => {
            u.role = select.value;
            statusMessage = "The role of " + u.name + " is now " + ROLE_LABELS[u.role] + ".";
            render();
          });
          roleCell = el("span");
          roleCell.appendChild(select);
          roleCell.appendChild(save);
        } else {
          roleCell = ROLE_LABELS[u.role] + (isMe ? " (you)" : "");
        }
        return [u.name, u.email, roleCell];
      });
      view.appendChild(makeTable(["Name", "Email address", "Role"], rows));
      view.appendChild(el("p", "Names and email addresses are Private data. The database also enforces that only an Admin can change a role.", "note"));
    }

    function renderPlaceholder(view, level, name) {
      view.appendChild(el("h2", screens[name].title));
      view.appendChild(el("p", "This screen is not built yet."));
      if (name === "audit") view.appendChild(el("p", "It is waiting for the audit table name from the database owner.", "note"));
    }

    // 6. Hash routes: read the part of the address after the hash, then draw that screen.
    function render() {
      const allowed = Object.keys(screens).filter(n => screens[n].access[role]);
      const hashName = location.hash.replace("#/", "");
      const name = screens[hashName] ? hashName : allowed[0];

      const nav = document.getElementById("nav");
      nav.replaceChildren();
      allowed.forEach(n => {
        const link = el("a", screens[n].title);
        link.href = "#/" + n;
        if (n === name) link.className = "active";
        nav.appendChild(link);
      });

      const view = document.getElementById("view");
      view.replaceChildren();
      const level = screens[name].access[role];
      if (!level) {
        view.appendChild(el("h2", "No access"));
        view.appendChild(el("p", "This role may not open this screen."));
        return;
      }
      screens[name].render(view, level, name);
    }

    // 7. Start.
    const roleSelect = document.getElementById("roleSelect");
    Object.keys(DEMO_PERSON).forEach(key => {
      const option = el("option", ROLE_LABELS[key]);
      option.value = key;
      roleSelect.appendChild(option);
    });
    roleSelect.addEventListener("change", () => { role = roleSelect.value; statusMessage = ""; render(); });
    window.addEventListener("hashchange", render);
    render();
  </script>
</body>
</html>
